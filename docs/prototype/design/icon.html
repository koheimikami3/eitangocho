<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
  html, body { margin: 0; padding: 0; background: #eceef2; }
  a { color: #0a6ee0; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</helmet>

<section style="padding:48px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Hiragino Sans',sans-serif;">
  <div style="font-size:13px;font-weight:700;color:rgba(0,0,0,0.45);margin-bottom:20px;">アプリアイコン案(macOS)</div>
  <div style="display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start;">

    <!-- 1a: カードめくり A/あ -->
    <div id="1a" style="display:flex;flex-direction:column;gap:14px;align-items:center;">
      <div style="align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#1d1d1f;color:#fff;">1a</div>
      <svg width="176" height="176" viewBox="0 0 1024 1024">
        <defs>
          <linearGradient id="bg1a" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3f8bef"></stop>
            <stop offset="1" stop-color="#0a5bc4"></stop>
          </linearGradient>
          <filter id="sh1a" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#04306b" flood-opacity="0.45"></feDropShadow>
          </filter>
        </defs>
        <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg1a)"></rect>
        <g filter="url(#sh1a)">
          <rect x="330" y="270" width="430" height="530" rx="48" fill="#dce8fa" transform="rotate(8 545 535)"></rect>
          <rect x="264" y="250" width="430" height="530" rx="48" fill="#ffffff"></rect>
        </g>
        <text x="479" y="580" text-anchor="middle" font-family="-apple-system,'SF Pro',sans-serif" font-size="330" font-weight="800" fill="#0a5bc4">A</text>
        <text x="810" y="595" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="160" font-weight="700" fill="#ffffff" transform="rotate(8 810 545)">あ</text>
      </svg>
      <div style="font-size:12px;color:rgba(0,0,0,0.55);text-align:center;max-width:200px;">カードめくり(A → あ)。<br />フラッシュクイズを象徴</div>
    </div>

    <!-- 1b: 白ベース + 2枚カード -->
    <div id="1b" style="display:flex;flex-direction:column;gap:14px;align-items:center;">
      <div style="align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#1d1d1f;color:#fff;">1b</div>
      <svg width="176" height="176" viewBox="0 0 1024 1024">
        <defs>
          <linearGradient id="bg1b" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fdfdfe"></stop>
            <stop offset="1" stop-color="#e8ecf3"></stop>
          </linearGradient>
          <filter id="sh1b" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1d3a66" flood-opacity="0.30"></feDropShadow>
          </filter>
        </defs>
        <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg1b)"></rect>
        <g filter="url(#sh1b)">
          <rect x="200" y="330" width="400" height="480" rx="44" fill="#ffffff" stroke="#d4dcea" stroke-width="6" transform="rotate(-6 400 570)"></rect>
          <rect x="440" y="300" width="400" height="480" rx="44" fill="#0a6ee0"></rect>
        </g>
        <text x="398" y="650" text-anchor="middle" font-family="-apple-system,'SF Pro',sans-serif" font-size="280" font-weight="800" fill="#0a6ee0" transform="rotate(-6 400 570)">A</text>
        <text x="640" y="630" text-anchor="middle" font-family="'Hiragino Sans',sans-serif" font-size="250" font-weight="700" fill="#ffffff">あ</text>
        <circle cx="820" cy="770" r="110" fill="#28c840" stroke="#ffffff" stroke-width="20"></circle>
        <path d="M765 770 l38 40 l72 -80" stroke="#ffffff" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="font-size:12px;color:rgba(0,0,0,0.55);text-align:center;max-width:200px;">白ベース + 学習済みチェック。<br />アプリ UI と同じ配色</div>
    </div>

    <!-- 1c: 発音フォーカス -->
    <div id="1c" style="display:flex;flex-direction:column;gap:14px;align-items:center;">
      <div style="align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#1d1d1f;color:#fff;">1c</div>
      <svg width="176" height="176" viewBox="0 0 1024 1024">
        <defs>
          <linearGradient id="bg1c" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#20365c"></stop>
            <stop offset="1" stop-color="#101d36"></stop>
          </linearGradient>
        </defs>
        <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg1c)"></rect>
        <text x="440" y="560" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="300" font-weight="600" fill="#ffffff">eɪ</text>
        <path d="M660 430 v160 h90 l110 100 V330 l-110 100 h-90z" fill="#3f8bef" transform="scale(0.9) translate(105 65)"></path>
        <path d="M880 470 c40 25 40 85 0 110" stroke="#3f8bef" stroke-width="34" fill="none" stroke-linecap="round" transform="translate(-6 -3)"></path>
        <text x="512" y="810" text-anchor="middle" font-family="-apple-system,'SF Pro',sans-serif" font-size="96" font-weight="600" fill="#8fa8cf" letter-spacing="18">/ WORDS /</text>
      </svg>
      <div style="font-size:12px;color:rgba(0,0,0,0.55);text-align:center;max-width:200px;">IPA + 発音再生。<br />ダークで Dock 上の存在感重視</div>
    </div>

  </div>

  <div style="margin-top:36px;font-size:12px;color:rgba(0,0,0,0.45);">Dock サイズでの見え方(64px / 32px)</div>
  <div style="display:flex;gap:40px;margin-top:12px;align-items:flex-end;min-height:64px;">{{ dockPreviewRow }}</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { dockPreviews: [] };

  componentDidMount() {
    // Rasterize the three inline SVGs for small-size dock previews
    setTimeout(() => {
      const svgs = document.querySelectorAll('section svg');
      const previews = [];
      svgs.forEach((svg) => {
        try {
          const xml = new XMLSerializer().serializeToString(svg);
          previews.push({ src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml) });
        } catch (e) {}
      });
      this.setState({ dockPreviews: previews });
    }, 300);
  }

  renderVals() {
    const e = React.createElement;
    const row = this.state.dockPreviews.map((p, i) =>
      e('div', { key: i, style: { display: 'flex', gap: 12, alignItems: 'flex-end' } },
        e('img', { src: p.src, width: 64, height: 64, style: { display: 'block' } }),
        e('img', { src: p.src, width: 32, height: 32, style: { display: 'block' } })
      )
    );
    return { dockPreviewRow: row };
  }
}
</script>
</body>
</html>
